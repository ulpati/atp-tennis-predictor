[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-tennis-predictor"
version = "1.0.0"
description = "ATP match predictor with leakage-free features, XGBoost and Elo ratings"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "ulpati" }]
keywords = ["tennis", "atp", "xgboost", "elo", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7",
]

[project.scripts]
atp = "atp_core.cli:main"

[project.urls]
Repository = "https://github.com/ulpati/atp-tennis-predictor"
Issues = "https://github.com/ulpati/atp-tennis-predictor/issues"

[tool.setuptools]
packages = ["atp_core"]

[tool.setuptools.package-data]
atp_core = ["data_checksums.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:atp_core.*"]

[tool.coverage.run]
source = ["atp_core"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "S108"]

[tool.bandit]
exclude_dirs = ["tests"]
